<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Google fonts - Poppins & Inter-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <!--Favicon-->
    <link rel="icon" type="image/png" href="images/world.png">
    <!--Metadata & stylesheets-->
    <meta name="description" content="Sign in to your account to view the social media feed, create post, and connect with other users.">
    <title>Social Media App | Login</title>
    <link rel="stylesheet" href="css/shared/global.css">
    <link rel="stylesheet" href="css/main.css">
  </head>
  <body>
    <header class="bg-white border-b border-[var(--border)]">
      <div
        class="container header-inner flex items-center justify-between min-h-16 py-3">
        <a class="brand text-2xl text-[var(--text)]" href="index.html">SMA</a>
        <nav class="nav flex gap-4" aria-label="Primary">
          <!--When logged out-->
          <a class="nav-link hide-when-auth text-[var(--text)] hover:underline underline-offset-4 decoration-[var(--primary)] transition" href="login.html">Sign in</a>
          <a class="nav-link hide-when-auth text-[var(--text)] hover:underline underline-offset-4 decoration-[var(--primary)] transition" href="register.html">Register</a>
          <!--When logged in-->
          <a class="nav-link show-when-auth text-[var(--text)] hover:underline underline-offset-4 decoration-[var(--primary)] transition" href="profile.html">My profile</a>
          <button class="nav-link btn-link show-when-auth text-[var(--text)] hover:underline underline-offset-4 decoration-[var(--primary)] transition" id="logoutBtn" type="button">
            Logout
          </button>
        </nav>
      </div>
    </header>
    <main class="min-h-[70vh] grid place-items-center bg-[var(--bg)] px-4 py-12">
      <section
        class="w-full max-w-md bg-white border border-[var(--border)] rounded-2xl shadow p-6">
        <h1 id="login-heading" class="text-2xl font-bold text-[var(--text)] mb-8">Sign in</h1>
        <form id="loginForm"
          method="post"
          class="space-y-5"
          aria-labelledby="login-heading">
          <!--Email-->
          <div>
            <label for="email" class="block text-sm text-[var(--muted)] mb-1">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              required
              class="w-full rounded-xl border border-[var(--border)] px-4 py-2 text-[var(--text)] focus:outline-none focus:ring-4 focus:ring-indigo-200">
          </div>
          <!--Password-->
          <div>
            <label for="password" class="block text-sm text-[var(--muted)] mb-1">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              minlength="8"
              autocomplete="current-password"
              required
              class="w-full rounded-xl border border-[var(--border)] px-4 py-2 text-[var(--text)] focus:outline-none focus:ring-4 focus:ring-indigo-200">
          </div>
          <button type="submit" class="w-full rounded-lg font-semibold py-3 bg-[var(--primary-600)] text-white hover:bg-[var(--primary-700)] transition cursor-pointer">
            Log in
          </button>
          <p class="text-center text-sm text-[var(--muted)]">
            <a href="#" class="font-semibold text-[var(--muted)] hover:underline">Lost your password?</a>
          </p>
        </form>
      </section>
    </main>
    <footer class="site-footer"></footer>
    <script type="module" src="js/main/login.js"></script>
    <script type="module" src="js/main/header.js"></script>
  </body>
</html>
